# Pulse (menu bar monitor on the Mac): read-only Docker API + container start.
# Only list/inspect/start are allowed; everything else is refused by the proxy.
services:
  pulse-docker-proxy:
    image: wollomatic/socket-proxy:1
    container_name: pulse-docker-proxy
    restart: unless-stopped
    user: "65534:996"
    read_only: true
    mem_limit: 64M
    cap_drop: [ALL]
    security_opt: ["no-new-privileges"]
    ports:
      - "8772:2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - '-loglevel=info'
      - '-listenip=0.0.0.0'
      # Replace with the IP your requests arrive from (e.g. the Proxmox host when DNAT'd).
      - '-allowfrom=192.168.1.2/32'
      - '-allowGET=^(/v[0-9.]+)?/(_ping|version|containers/json|containers/[a-zA-Z0-9_.-]+/json)$'
      - '-allowHEAD=^(/v[0-9.]+)?/_ping$'
      - '-allowPOST=^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/start$'
      - '-watchdoginterval=3600'
      - '-stoponwatchdog'
      - '-shutdowngracetime=5'
